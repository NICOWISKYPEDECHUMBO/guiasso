<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ARQUIVO DE GUIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:ital,wght@0,400;0,700;0,800;1,700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fvwpgftwoqrxwcoxgjje.supabase.co" crossorigin>
<style>
  :root{
    --tinta:#1a1714;        /* preto contorno   */
    --verde:#bcd0b5;        /* fundo quadrinho  */
    --verde2:#a9c2a1;
    --creme:#f6f1e3;        /* papel            */
    --amarelo:#e9b24a;      /* destaque         */
    --amarelo2:#f0c56d;
    --vermelho:#d9594a;
    --azul:#4a90d9;
    --sombra:6px 6px 0 var(--tinta);
    --sombra-p:3px 3px 0 var(--tinta);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--tinta);
    background:var(--verde);
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 1px,transparent 1px 46px);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,.banger{font-family:'Bangers',cursive;letter-spacing:1px;font-weight:400}
  .mao{font-family:'Patrick Hand',cursive}
  button{font-family:inherit;cursor:pointer}
  .hide{display:none!important}

  /* ---------- botões estilo HQ ---------- */
  .btn{
    border:3px solid var(--tinta);background:var(--amarelo);color:var(--tinta);
    font-weight:800;font-size:15px;padding:10px 16px;border-radius:12px;
    box-shadow:var(--sombra-p);transition:transform .05s, box-shadow .05s;
    display:inline-flex;align-items:center;gap:8px;line-height:1;
  }
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--tinta)}
  .btn.azul{background:var(--azul);color:#fff}
  .btn.verm{background:var(--vermelho);color:#fff}
  .btn.branco{background:var(--creme)}
  .btn.grande{font-size:18px;padding:14px 22px}
  .btn:disabled{opacity:.55;cursor:not-allowed}

  /* ---------- painéis ---------- */
  .painel{background:var(--creme);border:3px solid var(--tinta);border-radius:16px;box-shadow:var(--sombra)}

  /* ---------- topo ---------- */
  header{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 16px;background:var(--amarelo);
    border-bottom:4px solid var(--tinta);
  }
  header .logo{font-size:30px;line-height:.9}
  header .logo small{display:block;font-family:'Patrick Hand',cursive;font-size:13px;letter-spacing:0}
  header .quem{margin-left:auto;font-weight:700;font-size:13px;display:flex;align-items:center;gap:10px}
  header .quem .email{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8}

  .wrap{max-width:1000px;margin:0 auto;padding:16px}

  /* ---------- migalha / barra ---------- */
  .barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .migalha{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .migalha a{color:var(--tinta);cursor:pointer;text-decoration:underline dotted}
  .busca{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
    background:var(--creme);border:3px solid var(--tinta);border-radius:12px;padding:8px 12px;box-shadow:var(--sombra-p)}
  .busca input{border:0;background:transparent;outline:0;font-family:inherit;font-size:15px;font-weight:700;flex:1;color:var(--tinta)}

  /* ---------- grades ---------- */
  .grade{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

  /* armário = remessa */
  .armario{background:var(--creme);border:3px solid var(--tinta);border-radius:14px;box-shadow:var(--sombra);
    padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;transition:transform .06s}
  .armario:active{transform:translate(2px,2px)}
  .armario .capa{height:70px;border:3px solid var(--tinta);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:34px}
  .capa-arm{height:78px;border:3px solid var(--tinta);border-radius:8px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 10px}
  .capa-arm .gav{height:15px;background:rgba(255,255,255,.4);border:2px solid var(--tinta);border-radius:4px;position:relative}
  .capa-arm .gav::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:3px;background:var(--tinta);border-radius:2px}
  .armario .nome{font-family:'Bangers',cursive;font-size:22px;line-height:1;word-break:break-word}
  .armario .qtd{font-family:'Patrick Hand',cursive;font-size:14px;opacity:.8}
  .armario .lixo{position:absolute;top:8px;right:8px;background:var(--creme);border:2px solid var(--tinta);border-radius:8px;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:var(--sombra-p)}

  /* pasta = guia */
  .pasta{cursor:pointer;position:relative;transition:transform .06s}
  .pasta:active{transform:translate(2px,2px)}
  .pasta .aba{height:14px;width:56%;background:var(--amarelo);border:3px solid var(--tinta);border-bottom:0;
    border-radius:10px 10px 0 0;margin-left:8px;position:relative;top:3px}
  .pasta .corpo{background:var(--creme);border:3px solid var(--tinta);border-radius:6px 12px 12px 12px;box-shadow:var(--sombra);
    padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
  .pasta .boneco{width:100%;aspect-ratio:1;border:3px solid var(--tinta);border-radius:10px;overflow:hidden;background:#fff}
  .pasta .boneco svg{display:block;width:100%;height:100%}
  .pasta .nome{font-weight:800;font-size:14px;text-align:center;line-height:1.1;word-break:break-word}
  .pasta .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .tag{font-family:'Patrick Hand',cursive;font-size:12px;background:var(--amarelo2);border:2px solid var(--tinta);
    border-radius:20px;padding:1px 8px}
  .tag.clip::before{content:"📎 "}
  .pasta .remlbl{font-family:'Patrick Hand',cursive;font-size:12px;opacity:.75}

  /* card "adicionar" */
  .add{border:3px dashed var(--tinta);border-radius:14px;background:transparent;color:var(--tinta);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;min-height:120px;
    font-family:'Bangers',cursive;font-size:20px}
  .add span{font-size:40px;line-height:.7}
  .add:active{transform:translate(2px,2px)}

  /* vazio */
  .vazio{grid-column:1/-1;text-align:center;padding:30px 16px;font-family:'Patrick Hand',cursive;font-size:18px;opacity:.85}
  .vazio .balao{display:inline-block;background:var(--creme);border:3px solid var(--tinta);border-radius:16px;
    padding:16px 22px;box-shadow:var(--sombra);position:relative}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(26,23,20,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--creme);border:4px solid var(--tinta);
    border-radius:18px;box-shadow:8px 8px 0 var(--tinta);padding:20px}
  .modal h2{font-size:30px;margin-bottom:6px}
  .modal .campo{display:flex;flex-direction:column;gap:5px;margin-top:12px}
  .modal label{font-weight:800;font-size:14px}
  .modal input[type=text],.modal input[type=email],.modal input[type=password],.modal input[type=date],.modal input[type=file]{
    font-family:inherit;font-size:15px;font-weight:700;color:var(--tinta);
    border:3px solid var(--tinta);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
  .modal input[type=file]{padding:8px;background:#fff}
  .modal .acoes{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .modal .acoes .btn{flex:1;justify-content:center}
  .cores{display:flex;gap:8px;flex-wrap:wrap}
  .cores .c{width:34px;height:34px;border:3px solid var(--tinta);border-radius:8px;box-shadow:var(--sombra-p)}
  .cores .c[aria-checked=true]{outline:3px solid var(--tinta);outline-offset:2px}
  .aviso{font-family:'Patrick Hand',cursive;font-size:14px;background:var(--amarelo2);border:2px solid var(--tinta);
    border-radius:10px;padding:8px 12px;margin-top:12px}
  .erro{color:#fff;background:var(--vermelho);border:2px solid var(--tinta);border-radius:10px;padding:8px 12px;
    font-weight:700;font-size:14px;margin-top:12px}

  /* detalhe da guia */
  .det{display:flex;flex-direction:column;gap:6px;font-weight:700}
  .det .linha{display:flex;gap:8px}
  .det .linha b{min-width:96px}
  .det .bonecobig{width:120px;aspect-ratio:1;border:3px solid var(--tinta);border-radius:12px;overflow:hidden;background:#fff;margin:0 auto}

  /* ---------- ARMÁRIO (móvel de arquivo, igual ao original) ---------- */
  .grade-cab{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));align-items:end}
  @keyframes pop{0%{transform:scale(.96)}100%{transform:scale(1)}}
  .cab{position:relative;cursor:pointer;animation:pop .2s ease}
  .cab .plate{position:relative;z-index:4;margin:0 auto -7px;width:88%;background:#f3ecd8;border:3px solid var(--tinta);border-radius:6px;
    transform:rotate(-1.3deg);box-shadow:2px 2px 0 var(--tinta);padding:5px 8px;text-align:center;font-family:'Patrick Hand',cursive;
    font-size:18px;line-height:1.1;word-break:break-word}
  .cab .body{border:3px solid var(--tinta);border-radius:8px;box-shadow:5px 5px 0 var(--tinta);padding:15px 13px 12px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(0,0,0,.04) 28%,rgba(0,0,0,.2)),var(--tint)}
  .cab .front{height:40px;margin-bottom:10px;border:2.5px solid rgba(0,0,0,.42);border-radius:6px;display:grid;place-items:center;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.16))}
  .cab .front:last-child{margin-bottom:0}
  .cab .front .knob{width:46px;height:10px;border-radius:6px;background:rgba(0,0,0,.4);border:2px solid rgba(0,0,0,.5)}
  .cab .del{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;background:#cf5c4b;color:#fff;
    border:3px solid var(--tinta);font-weight:800;font-size:15px;cursor:pointer;z-index:6;line-height:1}
  .cab .edit{position:absolute;top:-10px;left:-10px;width:26px;height:26px;border-radius:50%;background:#f0c56d;color:var(--tinta);
    border:3px solid var(--tinta);font-weight:800;font-size:13px;cursor:pointer;z-index:6;line-height:1}
  .drawer .edit{width:26px;height:26px;border-radius:50%;background:#f0c56d;color:var(--tinta);border:2.5px solid var(--tinta);
    font-weight:800;font-size:13px;cursor:pointer;flex:none;line-height:1}
  .cab .meta{text-align:center;font-size:12px;font-weight:800;color:#3a362f;margin-top:7px;font-family:'Patrick Hand',cursive}
  .add-cab{min-height:184px;border:3px dashed var(--tinta);border-radius:8px;background:rgba(255,255,255,.28);
    font-family:'Patrick Hand',cursive;font-size:20px;color:var(--tinta);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .add-cab:active{transform:translate(2px,2px)}

  /* ---------- CABINET ABERTO com as GAVETAS (remessas) ---------- */
  .cabinet-open{max-width:780px;margin:0 auto}
  .cabinet-open h2{font-family:'Bangers',cursive;font-size:34px;letter-spacing:1px;margin:0 0 12px}
  .painel-cab{border:3px solid var(--tinta);border-radius:12px;box-shadow:6px 6px 0 var(--tinta);padding:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(0,0,0,.05) 20%,rgba(0,0,0,.18)),var(--tint)}
  .painel-cab .vaziocab{text-align:center;color:#f6f1e3;font-family:'Patrick Hand',cursive;font-size:18px;padding:6px 0 14px;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
  .drawer{position:relative;display:flex;align-items:center;gap:14px;padding:0 14px;min-height:62px;border:3px solid var(--tinta);border-radius:8px;
    margin-bottom:12px;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(0,0,0,.16));box-shadow:3px 3px 0 var(--tinta);cursor:pointer;animation:pop .2s ease}
  .drawer .knob{width:62px;height:13px;border-radius:7px;background:rgba(0,0,0,.42);border:2px solid rgba(0,0,0,.55);flex:none}
  .drawer .tag{flex:1;min-width:0;background:#f3ecd8;border:2.5px solid var(--tinta);border-radius:6px;transform:rotate(-.6deg);
    box-shadow:2px 2px 0 var(--tinta);padding:5px 10px;font-family:'Patrick Hand',cursive;font-size:18px;color:var(--tinta);word-break:break-word}
  .drawer .dmeta{font-size:12px;font-weight:800;color:#2a2620;font-family:'Patrick Hand',cursive;white-space:nowrap;flex:none}
  .drawer .del{width:26px;height:26px;border-radius:50%;background:#cf5c4b;color:#fff;border:2.5px solid var(--tinta);font-weight:800;cursor:pointer;flex:none;line-height:1}
  .add-drawer{width:100%;min-height:52px;border:3px dashed var(--tinta);border-radius:8px;background:rgba(255,255,255,.32);
    font-family:'Patrick Hand',cursive;font-size:18px;color:var(--tinta);cursor:pointer}

  /* ---------- exames e total na guia ---------- */
  .ex-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .ex-sel{flex:1;min-width:150px;font-family:inherit;font-weight:700;border:3px solid var(--tinta);border-radius:10px;padding:7px;background:#fff;color:var(--tinta)}
  .ex-val{font-weight:800;white-space:nowrap;min-width:78px;text-align:right}
  .ex-del{border:2px solid var(--tinta);background:var(--vermelho);color:#fff;border-radius:8px;width:28px;height:28px;font-weight:800;cursor:pointer;flex:none}
  .ex-modo{border:2px solid var(--tinta);background:var(--amarelo2);color:var(--tinta);border-radius:8px;padding:2px 8px;font-weight:800;font-size:11px;cursor:pointer;flex:none}
  .ex-desc{flex-basis:100%;font-family:'Patrick Hand',cursive;font-size:12px;opacity:.7;margin:-2px 0 2px}
  .ex-vazio{font-family:'Patrick Hand',cursive;opacity:.7;font-size:14px;padding:4px 0}
  .ex-total{display:flex;align-items:center;gap:12px;margin-top:8px;font-weight:800;font-size:18px;border-top:2px solid var(--tinta);padding-top:8px}
  .ex-total b{color:#2f7d43}
  .ex-topo{display:flex;align-items:center;gap:12px;margin:8px 0 12px;font-weight:800;font-size:19px;background:#eaf6ee;border:3px solid var(--tinta);border-radius:10px;padding:8px 12px}
  .ex-topo b{color:#2f7d43;font-size:22px}
  .total-pasta{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;background:#190a2e;    border:3px solid var(--tinta);border-radius:12px;padding:12px 14px;font-family:'Bangers',cursive;letter-spacing:1px;
    font-size:22px;color:#c46bff;text-shadow:0 0 6px #b026ff,0 0 14px #a020f0;box-shadow:0 0 12px rgba(176,38,255,.45), var(--sombra-p)}
  .total-pasta b{color:#efb6ff;font-size:27px;text-shadow:0 0 8px #d060ff,0 0 18px #b026ff}
  .selbar{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
  .pasta .checkbox{position:absolute;top:6px;left:6px;z-index:6;width:30px;height:30px;border:3px solid var(--tinta);border-radius:8px;
    background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2f7d43;font-size:19px;box-shadow:var(--sombra-p)}
  .pasta.sel .corpo{outline:4px solid #2f7d43;outline-offset:2px}

  /* ---------- carimbos / documento ---------- */
  .paper{position:relative;background:#fffdf5;border:3px solid var(--tinta);border-radius:8px;min-height:210px;overflow:hidden;margin-top:6px;
    background-image:repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.05) 26px 27px);box-shadow:inset 0 0 0 2px #fff}
  .paper .vazp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Patrick Hand',cursive;opacity:.4;font-size:15px}
  .carimbos-area{position:absolute;inset:0}
  .selos-info{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:3;pointer-events:none}
  .selo-info{pointer-events:auto;cursor:pointer;border:3px double var(--ink);color:var(--ink);border-radius:8px;padding:2px 12px;
    background:rgba(255,255,255,.6);transform:rotate(-2deg);text-shadow:0 0 1px var(--ink);max-width:96%;display:flex;align-items:baseline;gap:8px}
  .selo-info b{font-family:'Nunito',sans-serif;font-size:9px;font-weight:800;letter-spacing:1px;opacity:.85}
  .selo-info .lb2{font-family:'Bangers',cursive;letter-spacing:1px;font-size:16px;word-break:break-word;line-height:1.1}
  .carimbo{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));text-align:center;pointer-events:none;
    border:3px double var(--ink);color:var(--ink);border-radius:10px;padding:3px 10px 2px;background:rgba(255,255,255,.06);
    opacity:.92;filter:contrast(1.05);text-shadow:0 0 1px var(--ink)}
  .carimbo .lb{font-family:'Bangers',cursive;letter-spacing:1px;font-size:19px;display:block;white-space:nowrap;line-height:1}
  .carimbo .dt{font-family:'Nunito',sans-serif;font-size:9px;font-weight:800;letter-spacing:0}
  .carimbo.novo{animation:bater .3s cubic-bezier(.2,1.4,.4,1)}
  @keyframes bater{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.7);opacity:0}
    55%{opacity:1}70%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.9)}
    100%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1);opacity:.92}}
  .stamper{position:absolute;left:50%;top:42%;z-index:5;pointer-events:none;text-align:center}
  .stamper .cabo{width:16px;height:24px;background:var(--tinta);border-radius:4px;margin:0 auto 3px}
  .stamper .face{border:3px double var(--ink);color:var(--ink);border-radius:10px;padding:3px 12px;font-family:'Bangers',cursive;
    font-size:22px;letter-spacing:1px;background:#fff;white-space:nowrap}
  .stamper.desce{animation:desce .3s ease-out forwards}
  @keyframes desce{0%{transform:translate(-50%,-150%) scale(1.12);opacity:0}60%{opacity:1}
    82%{transform:translate(-50%,-46%) scale(.95)}100%{transform:translate(-50%,-50%) scale(1)}}
  .shake{animation:shk .18s 1}
  @keyframes shk{0%,100%{transform:none}25%{transform:translateY(2px)}50%{transform:translateX(-2px)}75%{transform:translateY(-1px)}}
  .paleta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .cbtn{border:3px solid var(--tinta);border-radius:10px;padding:7px 10px;font-family:'Bangers',cursive;letter-spacing:.5px;font-size:15px;
    background:#fff;color:var(--ink);box-shadow:var(--sombra-p);line-height:1}
  .cbtn:active{transform:translate(3px,3px);box-shadow:0 0 0}
  .selo-tag{font-family:'Bangers',cursive;letter-spacing:.5px;font-size:12px;border:2px solid var(--ink);color:var(--ink);
    border-radius:6px;padding:1px 6px;background:#fff}

  /* ---------- IMPRESSÃO da gaveta ---------- */
  #printarea{display:none}
  @media print{
    @page{margin:12mm}
    body{background:#fff!important}
    body *{visibility:hidden!important}
    #printarea, #printarea *{visibility:visible!important}
    #printarea{display:block!important;position:absolute;left:0;top:0;width:100%;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .p-drawerwrap{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(0,0,0,.05) 20%,rgba(0,0,0,.18)),var(--tint);
      border:3px solid #1a1714;border-radius:12px;padding:14px;margin-bottom:6px}
    .p-drawer{display:flex;align-items:center;gap:14px;padding:0 14px;min-height:60px;border:3px solid #1a1714;border-radius:8px;
      background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(0,0,0,.16))}
    .p-knob{width:60px;height:13px;border-radius:7px;background:rgba(0,0,0,.42);border:2px solid rgba(0,0,0,.55);flex:none}
    .p-etiqueta{flex:1;background:#f3ecd8;border:2.5px solid #1a1714;border-radius:6px;transform:rotate(-.6deg);padding:6px 12px;
      font-family:'Patrick Hand',cursive;font-size:22px;color:#1a1714;word-break:break-word}
    .p-count{font-family:'Patrick Hand',cursive;font-weight:700;font-size:14px;color:#1a1714;white-space:nowrap;flex:none}
    .p-sub{font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:#333;margin-bottom:14px}
    .p-grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}

<body>

<!-- ========================= LOGIN ========================= -->
<div id="auth">
  <div class="card painel">

<!-- ========================= APP ========================= -->

<div id="toast"></div>
<div id="modais"></div>
<div id="printarea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;

/* ===== Conexão com o SEU Supabase ===== */
const SUPABASE_URL = 'https://fvwpgftwoqrxwcoxgjje.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CAvjAOYF8KONEXQfkb7pRA_0SD0GHxO';
const BUCKET = 'guias';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== atalhos ===== */
const $ = s => document.querySelector(s);
const elAuth = $('#auth'), elApp = $('#app'), elConteudo = $('#conteudo'), elMigalha = $('#migalha');
let USER = null;
let armarioAtual = null;        // objeto armário aberto (ou null)
let remessaAtual = null;        // objeto remessa aberta (ou null)
let selMode = false;            // modo de seleção múltipla de guias
let selSet = new Set();         // ids das guias selecionadas

/* ===== toast ===== */
function toast(msg, tipo=''){
  const t = document.createElement('div');
  t.className = 'toast ' + tipo;
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ===== escape ===== */
const esc = s => (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataBR = s => { if(!s) return '—'; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };

/* ===== carimbos ===== */
const CARIMBOS = [
  { t:'LANÇADO',      c:'#2f7d43' },
  { t:'ENVIADO GEAP', c:'#2f6fd0' },
  { t:'EM ANÁLISE',   c:'#b07d1a' },
  { t:'DEVOLVIDO',    c:'#d9772f' },
  { t:'DUPLICADO',    c:'#7a3fd0' },
  { t:'CANCELADO',    c:'#c62f2f' },
];
const corCarimbo = t => (CARIMBOS.find(x=>x.t===t)||{c:'#333'}).c;
const dataHora = ts => { const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };

/* ===================================================================
   BONECO ALEATÓRIO (SVG desenhado a partir do "seed" salvo na guia)
   =================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function boneco(seed){
  const r = mulberry32(seed>>>0);
  const pick = a => a[Math.floor(r()*a.length)];
  const skin  = pick(['#ffdbac','#f1c27d','#e0ac69','#c68642','#8d5524']);
  const hair  = pick(['#1a1714','#3b2417','#6b3e26','#b55239','#d9a441','#7a7a7a','#efe6d2']);
  const shirt = pick(['#e9b24a','#4a90d9','#59b36a','#d9594a','#8e5bd9','#d97fb0','#3ec6c6','#f0714f']);
  const bg    = pick(['#bcd0b5','#cbd8c2','#d8cf9f','#c6d3dd','#e6cfc6','#d9cbe6']);
  const est   = Math.floor(r()*5);       // estilo de cabelo
  const oculos= r() < 0.35;
  const T = 'stroke="#1a1714" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  let cabelo = '';
  if(est===0) cabelo = `<path d="M29,47 Q29,23 50,23 Q71,23 71,47 Q64,35 50,35 Q36,35 29,47 Z" fill="${hair}" ${T}/>`;
  else if(est===1) cabelo = `<path d="M30,40 Q50,20 70,40 Q60,31 50,31 Q40,31 30,40 Z" fill="${hair}" ${T}/>`;
  else if(est===2) cabelo = `<path d="M30,42 L36,26 L42,38 L50,24 L58,38 L64,26 L70,42 Q50,34 30,42 Z" fill="${hair}" ${T}/>`;
  else if(est===3) cabelo = ``; // careca
  else cabelo = `<g fill="${hair}" ${T}><circle cx="34" cy="34" r="9"/><circle cx="50" cy="27" r="10"/><circle cx="66" cy="34" r="9"/></g>`;
  const olhos = oculos
    ? `<g ${T} fill="#fff"><circle cx="42" cy="47" r="6"/><circle cx="58" cy="47" r="6"/></g>
       <line x1="48" y1="47" x2="52" y2="47" ${T}/>
       <circle cx="42" cy="47" r="2" fill="#1a1714"/><circle cx="58" cy="47" r="2" fill="#1a1714"/>`
    : `<circle cx="42" cy="47" r="2.6" fill="#1a1714"/><circle cx="58" cy="47" r="2.6" fill="#1a1714"/>`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="${bg}"/>
    <path d="M16,100 C16,80 30,72 50,72 C70,72 84,80 84,100 Z" fill="${shirt}" ${T}/>
    <path d="M42,72 L50,80 L58,72" fill="none" ${T}/>
    <circle cx="50" cy="48" r="21" fill="${skin}" ${T}/>
    <circle cx="29" cy="50" r="4" fill="${skin}" ${T}/><circle cx="71" cy="50" r="4" fill="${skin}" ${T}/>
    ${cabelo}
    ${olhos}
    <path d="M43,58 Q50,65 57,58" fill="none" ${T}/>
  </svg>`;
}

/* ===================================================================
   MODAIS  (confirmar / formulários)
   =================================================================== */
function fecharModal(){ $('#modais').innerHTML=''; }
function abrirModal(html){
  const o = document.createElement('div'); o.className='overlay';
  o.innerHTML = `<div class="modal painel">${html}</div>`;
  o.addEventListener('click', e=>{ if(e.target===o) fecharModal(); });
  $('#modais').innerHTML=''; $('#modais').appendChild(o);
  return o;
}
/* confirmação estilo próprio (nunca confirm() nativo) */
function confirmar(titulo, msg, textoOk='Apagar'){
  return new Promise(res=>{
    const o = abrirModal(`
      <h2>${esc(titulo)}</h2>
      <p style="font-family:'Patrick Hand',cursive;font-size:16px;margin-top:6px">${esc(msg)}</p>
      <div class="acoes">
        <button class="btn branco" data-x>Cancelar</button>
        <button class="btn verm" data-ok>${esc(textoOk)}</button>
      </div>`);
    o.querySelector('[data-x]').onclick = ()=>{ fecharModal(); res(false); };
    o.querySelector('[data-ok]').onclick = ()=>{ fecharModal(); res(true); };
  });
}

/* ===================================================================
   AUTENTICAÇÃO
   =================================================================== */
function authErro(msg){ const e=$('#a-erro'); e.textContent=msg; e.classList.remove('hide'); $('#a-aviso').classList.add('hide'); }
function authAviso(msg){ const e=$('#a-aviso'); e.textContent=msg; e.classList.remove('hide'); $('#a-erro').classList.add('hide'); }
function limpaAuth(){ $('#a-erro').classList.add('hide'); $('#a-aviso').classList.add('hide'); }
function traduzErro(m){
  m = (m||'').toLowerCase();
  if(m.includes('invalid login')) return 'E-mail ou senha errados.';
  if(m.includes('email not confirmed')) return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
  if(m.includes('already registered')) return 'Esse e-mail já tem conta. É só entrar.';
  if(m.includes('password')&&m.includes('6')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(m.includes('rate')) return 'Muitas tentativas. Espera um minutinho.';
  return m || 'Deu algo errado, tenta de novo.';
}

$('#a-entrar').onclick = async ()=>{
  limpaAuth();
  const email=$('#a-email').value.trim(), password=$('#a-pass').value;
  if(!email||!password) return authErro('Preencha e-mail e senha.');
  const b=$('#a-entrar'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  b.disabled=false; b.textContent='Entrar';
  if(error) return authErro(traduzErro(error.message));
  // onAuthStateChange cuida do resto
};
$('#a-criar').onclick = async ()=>{
  limpaAuth();
  const email=$('#a-email').value.trim(), password=$('#a-pass').value;
  if(!email||!password) return authErro('Preencha e-mail e senha.');
  if(password.length<6) return authErro('A senha precisa ter pelo menos 6 caracteres.');
  const b=$('#a-criar'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  const { data, error } = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: window.location.origin } });
  b.disabled=false; b.textContent='Criar conta';
  if(error) return authErro(traduzErro(error.message));
  // Por segurança, o Supabase NÃO dá erro quando o e-mail já existe:
  // ele devolve o usuário sem "identities". Detectamos isso e bloqueamos.
  if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
    return authErro('Esse e-mail já tem conta. Toque em Entrar ou use "Esqueci minha senha".');
  }
  if(data.user && !data.session){
    authAviso('Conta criada! Enviamos um e-mail de confirmação — clique no link e depois toque em Entrar.');
  }
};
$('#u-sair').onclick = async ()=>{ await sb.auth.signOut(); };
$('#u-valores').onclick = tabelaValores;
$('#u-sistema').onclick = abrirSistemaGuias;

// Esqueci minha senha — envia link que funciona aqui ou em qualquer outro aparelho
$('#a-esqueci').onclick = async ()=>{
  limpaAuth();
  const email=$('#a-email').value.trim();
  if(!email) return authErro('Escreva seu e-mail no campo acima e toque de novo.');
  const b=$('#a-esqueci'); b.disabled=true; const txt=b.textContent; b.textContent='Enviando…';
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  b.disabled=false; b.textContent=txt;
  if(error) return authErro(traduzErro(error.message));
  authAviso('Enviamos um link de recuperação pro seu e-mail. Abra em qualquer aparelho e crie uma senha nova.');
};

let recuperando = false;
let logado = false;   // já está dentro do app? (evita voltar pra home sozinho a cada renovação de sessão)
sb.auth.onAuthStateChange((ev, session)=>{
  if(ev === 'PASSWORD_RECOVERY'){ recuperando = true; USER = session?.user||null; telaNovaSenha(); return; }
  if(recuperando) return;              // segura o app até a nova senha ser criada
  if(session && session.user){
    USER = session.user;               // mantém o usuário atualizado (renovação de token etc.)
    if(!logado) entrarNoApp();         // só entra (e vai pra home) na PRIMEIRA vez
  } else {
    logado = false; USER = null;
    elApp.classList.add('hide'); elAuth.classList.remove('hide');
  }
});

function telaNovaSenha(){
  elAuth.classList.remove('hide'); elApp.classList.add('hide');
  const o = abrirModal(`
    <h2>Criar nova senha</h2>
    <p style="font-family:'Patrick Hand',cursive;font-size:15px;margin-top:4px">Digite a senha nova que você vai usar a partir de agora.</p>
    <div class="campo"><label>Nova senha</label>
      <input id="ns" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres"></div>
    <div id="ns-erro" class="erro hide"></div>
    <div class="acoes"><button class="btn azul" id="ns-ok" style="flex:1;justify-content:center">Salvar nova senha</button></div>`);
  o.querySelector('#ns').focus();
  o.querySelector('#ns-ok').onclick = async ()=>{
    const pass=o.querySelector('#ns').value, er=o.querySelector('#ns-erro');
    if(pass.length<6){ er.textContent='A senha precisa ter pelo menos 6 caracteres.'; er.classList.remove('hide'); return; }
    const b=o.querySelector('#ns-ok'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
    const { error } = await sb.auth.updateUser({ password: pass });
    if(error){ b.disabled=false; b.textContent='Salvar nova senha'; er.textContent=traduzErro(error.message); er.classList.remove('hide'); return; }
    recuperando = false;
    try{ history.replaceState(null,'',window.location.pathname); }catch(e){}
    fecharModal(); toast('Senha alterada!','ok');
    const { data:{ session } } = await sb.auth.getSession();
    if(session?.user){ USER=session.user; entrarNoApp(); }
  };
}

async function entrarNoApp(){
  logado = true;
  $('#u-email').textContent = USER.email || '';
  elAuth.classList.add('hide'); elApp.classList.remove('hide');
  armarioAtual = null; remessaAtual = null;
  await irHome();
}

/* ===================================================================
   NAVEGAÇÃO
   =================================================================== */

async function imprimirGaveta(rem){
  const { data:guias, error } = await sb.from('guias').select('*').eq('remessa_id',rem.id).eq('arquivada',false).order('criado_em',{ascending:false});
  if(error){ toast('Erro ao preparar impressão: '+error.message,'bad'); return; }
  const hoje = new Date(); const p=n=>String(n).padStart(2,'0');
  const dataImp = `${p(hoje.getDate())}/${p(hoje.getMonth()+1)}/${hoje.getFullYear()}`;
  const cards = (guias||[]).map(g=>{
    const cs = (g.meta && g.meta.carimbos) || [];
    const ult = cs.slice(-2).reverse();
    return `<div class="p-card">
      <div class="p-boneco">${boneco(g.boneco_seed||1)}</div>
      <div class="p-nome">${esc(g.nome)}</div>
      <div class="p-tags">
        ${g.numero_guia?`<span class="p-tag">nº ${esc(g.numero_guia)}</span>`:''}
        ${g.arquivo_path?`<span class="p-tag">📎 arquivo</span>`:''}
        ${ult.map(c=>`<span class="p-selo" style="--ink:${corCarimbo(c.t)}">${esc(c.t)}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
  const pa = document.getElementById('printarea');
  pa.innerHTML = `
    <div class="p-drawerwrap" style="--tint:${esc(armarioAtual?.cor||'#8e5bd9')}">
      <div class="p-drawer">
        <div class="p-knob"></div>
        <div class="p-etiqueta">${esc(rem.nome)}</div>
        <div class="p-count">${guias.length} ${guias.length===1?'guia':'guias'}</div>
      </div>
    </div>
    <div class="p-sub">Armário: ${esc(armarioAtual?.nome||'')} · impresso em ${dataImp}</div>
    <div class="p-grid">${cards || '<div style="padding:20px;font-family:sans-serif">Gaveta sem guias.</div>'}</div>`;
  window.print();
}

async function apagarArmario(arm){
  if(!arm) return;
  const ok = await confirmar('Apagar armário?', `Isso apaga o armário "${arm.nome}" e TODAS as remessas, guias e arquivos dentro dele. Não dá pra desfazer.`, 'Apagar tudo');

  const { data:rems } = await sb.from('remessas').select('id').eq('armario_id',arm.id);
  const remIds = (rems||[]).map(r=>r.id);
  if(remIds.length){
    const { data:gs } = await sb.from('guias').select('arquivo_path').in('remessa_id',remIds);
    const paths = (gs||[]).map(g=>g.arquivo_path).filter(Boolean);
    if(paths.length) await sb.storage.from(BUCKET).remove(paths);
  }
  const { error } = await sb.from('armarios').delete().eq('id',arm.id); // remessas+guias caem por cascade
  if(error){ toast('Erro: '+error.message,'bad'); return; }
  toast('Armário apagado.','ok'); renderArmarios();

async function renderGuias(rem){
  elConteudo.className = 'grade';
  elConteudo.innerHTML = `<div class="vazio"><span class="spin" style="border-color:var(--tinta);border-top-color:transparent"></span></div>`;

function pintarGuias(guias, opts={}){
  elConteudo.className = 'grade';
  let html = '';
  if(opts.addPara){
    const somaPasta = guias.reduce((s,g)=> s + ((g.meta && Number(g.meta.total))||0), 0);
    html += `<div class="total-pasta">Total da pasta: <b>${fmtValor(somaPasta)}</b></div>`;
    html += `<div class="selbar">
      <button class="btn branco" id="sel-toggle">${selMode?'✕ Cancelar seleção':'☑️ Selecionar'}</button>
      ${selMode?`<button class="btn branco" id="sel-todas">Todas</button>
                 <button class="btn branco" id="sel-limpar">Limpar</button>
                 <button class="btn azul" id="sel-carimbar">🖋️ Carimbar (${selSet.size})</button>`:''}
    </div>`;
    html += `<button class="add" id="add-guia"><span>＋</span>Nova guia</button>`;
    html += `<button class="add" id="calc-guias" style="background:#d7f0dd"><span>🧮</span>Calcular guias</button>`;
    html += `<button class="add" id="ver-semex" style="background:#ffe6b3"><span>🔎</span>Verificar problemas</button>`;
    html += `<button class="add" id="btn-correio" style="background:#fff2c2"><span>📮</span>Correio (remessa)</button>`;
  }
  if(!guias.length){
    html += `<div class="vazio"><div class="balao">${opts.buscaVazia
      ? 'Nenhum resultado.'
      : 'Nenhuma guia nesta remessa.<br>Toque em <b>＋ Nova guia</b> para adicionar.'}</div></div>`;
  }
  guias.forEach(g=>{
    const cs = (g.meta && g.meta.carimbos) || [];
    const ult = cs.slice(-2).reverse();
    const total = (g.meta && Number(g.meta.total)) || 0;
    const sel = selSet.has(g.id);
    html += `<div class="pasta ${sel?'sel':''}" data-id="${g.id}">
      ${selMode?`<div class="checkbox">${sel?'✓':''}</div>`:''}
      <div class="aba"></div>
      <div class="corpo">
        <div class="boneco">${boneco(g.boneco_seed||1)}</div>
        <div class="nome">${esc(g.nome)}</div>
        ${g.__remnome ? `<div class="remlbl">📦 ${esc(g.__remnome)}</div>`:''}
        <div class="tags">
          ${g.numero_guia?`<span class="tag">nº ${esc(g.numero_guia)}</span>`:''}
          ${total>0?`<span class="tag" style="background:#d7f0dd">${fmtValor(total)}</span>`:''}
          ${g.arquivo_path?`<span class="tag clip">arquivo</span>`:`<span class="tag" style="background:#eee">sem arquivo</span>`}
        </div>
        ${ult.length?`<div class="tags">${ult.map(c=>`<span class="selo-tag" style="--ink:${corCarimbo(c.t)}">${esc(c.t)}</span>`).join('')}</div>`:''}
      </div>
    </div>`;
  });
  elConteudo.innerHTML = html;
  if(opts.addPara){
    $('#add-guia').onclick = ()=> formGuia(opts.addPara);
    const cg=document.getElementById('calc-guias'); if(cg) cg.onclick=()=> calcularGaveta(opts.addPara);
    const vs=document.getElementById('ver-semex'); if(vs) vs.onclick=()=> verificarSemExames(opts.addPara);
    const bc=document.getElementById('btn-correio'); if(bc) bc.onclick=()=> abrirCorreio(opts.addPara);
    const st=document.getElementById('sel-toggle'); if(st) st.onclick=()=>{ selMode=!selMode; if(!selMode) selSet.clear(); pintarGuias(guias, opts); };
    const sa=document.getElementById('sel-todas'); if(sa) sa.onclick=()=>{ guias.forEach(g=>selSet.add(g.id)); pintarGuias(guias, opts); };
    const sl=document.getElementById('sel-limpar'); if(sl) sl.onclick=()=>{ selSet.clear(); pintarGuias(guias, opts); };
    const sc=document.getElementById('sel-carimbar'); if(sc) sc.onclick=()=> carimbarLote(guias, opts);
  }
  elConteudo.querySelectorAll('.pasta').forEach(c=>{
    c.onclick = ()=>{
      const g = guias.find(x=>x.id===c.dataset.id);
      if(selMode){
        if(selSet.has(g.id)) selSet.delete(g.id); else selSet.add(g.id);
        pintarGuias(guias, opts);
      } else abrirGuia(g);
    };
  });
}

async function carimbarLote(guias, opts){
  const alvos = guias.filter(g=>selSet.has(g.id));
  if(!alvos.length){ toast('Selecione ao menos uma guia.'); return; }
  const paleta = CARIMBOS.map(c=>`<button class="cbtn" data-t="${esc(c.t)}" style="--ink:${c.c}">${esc(c.t)}</button>`).join('');
  const o = abrirModal(`
    <h2>Carimbar ${alvos.length} guia(s)</h2>
    <p style="font-family:'Patrick Hand',cursive;font-size:15px;margin-top:4px">Escolha o carimbo para aplicar em TODAS as selecionadas:</p>
    <div class="paleta">${paleta}</div>
    <div id="cl-erro" class="erro hide"></div>
    <div class="acoes"><button class="btn branco" data-x>Cancelar</button></div>`);
  o.querySelector('[data-x]').onclick = fecharModal;
  o.querySelectorAll('.cbtn').forEach(btn => btn.onclick = async ()=>{
    const t = btn.dataset.t;
    o.querySelectorAll('.cbtn').forEach(b=>b.disabled=true);
    btn.innerHTML='<span class="spin"></span>';
    let ok=0;
    for(const g of alvos){
      if(!g.meta) g.meta={}; if(!Array.isArray(g.meta.carimbos)) g.meta.carimbos=[];
      g.meta.carimbos.push({ t, ts:new Date().toISOString(),
        x:16+Math.floor(Math.random()*60), y:42+Math.floor(Math.random()*44), r:Math.floor(Math.random()*29)-14 });
      const { error } = await sb.from('guias').update({ meta:g.meta }).eq('id', g.id);
      if(!error) ok++;
    }
    fecharModal(); selMode=false; selSet.clear();
    toast(`Carimbado "${t}" em ${ok} guia(s)!`,'ok');
    recarregar();
  });
}

/* ===== OCR — lê a guia sozinho ao subir (Tesseract + pdf.js carregados sob demanda) ===== */
let OCR_LOADED = false;
function carregarOCR(){
  if(OCR_LOADED) return Promise.resolve();
  const load = src => new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('sem internet pro leitor')); document.head.appendChild(s); });
  return load('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')
    .then(()=> load('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'))
    .then(()=>{ if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; OCR_LOADED=true; });
}
function _normGuia(s){ return s.toUpperCase().replace(/\s+/g,'.').replace(/O/g,'0').replace(/\.+/g,'.').replace(/^\.|\.$/g,''); }
function _acharCodigo(texto){
  const t=texto.toUpperCase();
  let m=t.match(/([0-9A-Z]{4}[.\s][0-9A-Z]{4}[.\s][0-9A-Z]{4}[.\s][0-9A-Z]{4}[.\s][0-9A-Z]{4}[.\s][0-9A-Z]{4})/);
  if(m) return _normGuia(m[1]);
  m=t.match(/([0-9A-Z]{2,5}(?:[.\s][0-9A-Z]{2,5}){4,6})/);
  if(m && /\d/.test(m[1]) && /[A-Z]/.test(m[1])) return _normGuia(m[1]);
  m=t.match(/C[ÓO]DIGO:?\s*\n?\s*([0-9A-Z][0-9A-Z.\s]{16,44})/);
  if(m){ let s=m[1].replace(/[^0-9A-Z.\s]/g,''); s=_normGuia(s); if(s.replace(/\./g,'').length>=18) return s; }
  return '';
}
function _acharNome(texto){
  let m=texto.match(/Servidor[\s\S]{0,40}?Nome[\s:]*([A-ZÁ-Ú][A-ZÁ-Úa-zá-ú' ]{5,55})/i);
  if(!m) m=texto.match(/Nome[\s:]*([A-ZÁ-Ú]{2,}(?: [A-ZÁ-Úa-zá-ú']+){1,6})[\s\S]{0,30}?(?:Sexo|Data)/i);
  return m ? m[1].replace(/\s+(Sexo|Data).*/i,'').trim() : '';
}
function _acharExames(texto){
  if(!/exame|requi|solici|siass/i.test(texto)) return [];   // só varre se parece uma guia
  const out=[]; const vistos=new Set();
  const LIXO = /\b(RG|CPF|nascimento|matr[íi]cula|telefone|ans|cnpj|siape|autentic|c[óo]digo)\b/i;
  texto.split(/\n+/).map(s=>s.trim()).forEach(ln=>{
    if(LIXO.test(ln)) return;                          // linha de RG/CPF/código de autenticidade etc.
    const mc = ln.match(/(?:^|[\s\-–—])(\d{8})(?!\d)/); // código de exame = 8 dígitos colados
    if(!mc) return;
    const codigo = mc[1];
    if(vistos.has(codigo)) return;
    let d = ln.slice(ln.indexOf(codigo)+codigo.length).replace(/^[\s\-–—:]+/,'').trim();
    d = d.replace(/\bObser?[nv]?[a'][çc]?[ãa]?o?.*$/i,'').replace(/[-–—\s]+$/,'').trim();
    if(!/[A-Za-zÀ-ú]{3,}/.test(d)) return;             // precisa ter um "nome" — evita ID/RG/CPF
    vistos.add(codigo);
    out.push({ codigo, desc:d, raw:ln });
  });
  return out.slice(0,60);
}
function _preproc(cv){
  try{
    const ctx=cv.getContext('2d'); const im=ctx.getImageData(0,0,cv.width,cv.height); const d=im.data;
    for(let i=0;i<d.length;i+=4){
      let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      g=(g-128)*1.7+138;                                  // aumenta contraste e clareia o fundo
      g=g<0?0:(g>255?255:g);
      const v=g<140?Math.max(0,g-50):Math.min(255,g+30);  // reforça o texto escuro
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(im,0,0);
  }catch(e){}
  return cv;
}
function _imgParaCanvas(file){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=img.naturalWidth||img.width; cv.height=img.naturalHeight||img.height;
      cv.getContext('2d').drawImage(img,0,0); URL.revokeObjectURL(url); res(cv); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('imagem inválida')); };
    img.src=url;
  });
}
async function lerGuiaOCR(file, onStatus){
  await carregarOCR();
  let texto=''; let primeiraImg=null;
  const worker = await Tesseract.createWorker('por');
  try{
    if(file.type==='application/pdf'){
      onStatus('preparando o PDF...');
      const buf=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
      const n=Math.min(pdf.numPages, 25);
      for(let p=1;p<=n;p++){
        onStatus(`lendo página ${p} de ${n}…`);
        const page=await pdf.getPage(p);
        const vp=page.getViewport({scale:3});
        const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
        await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        _preproc(cv);
        if(p===1) primeiraImg=cv;
        const rp=await worker.recognize(cv);
        texto += '\n' + rp.data.text;
      }
    } else {
      onStatus('lendo o texto…');
      const cv=_preproc(await _imgParaCanvas(file));
      primeiraImg=cv;
      const rp=await worker.recognize(cv);
      texto=rp.data.text;
    }
  } finally { try{ await worker.terminate(); }catch(e){} }

  let codigo=_acharCodigo(texto);
  try{
    onStatus('confirmando o código…');
    const w=await Tesseract.createWorker('eng');
    await w.setParameters({ tessedit_char_whitelist:'0123456789ABCDEF. ' });
    const rc=await w.recognize(primeiraImg);
    await w.terminate();
    const gg=_acharCodigo(rc.data.text);
    if(gg) codigo=gg;
  }catch(e){}
  return { nome:_acharNome(texto), codigo, texto, exames:_acharExames(texto) };
}

let PRECOS = null;   // cache: [{nome, fonte, valor}]
async function carregarPrecos(force){
  if(PRECOS && !force) return PRECOS;
  const { data, error } = await sb.from('tabela_precos').select('*').order('nome');
  if(error){ toast('Erro na tabela de valores: '+error.message,'bad'); return PRECOS||[]; }
  PRECOS = data||[]; return PRECOS;
}
/* valor de um exame pela descrição: tenta GEAP primeiro, depois CNEM (igual seu app) */
function valorDoExame(desc){
  if(!PRECOS) return null;
  const nd = normEx(desc);
  if(!nd) return null;
  const busca = fonte => {
    let melhor=null, melhorPontos=0;
    for(const p of PRECOS){
      if(p.fonte!==fonte) continue;
      const nk = normEx(p.nome);
      let pontos = 0;
      if(nd===nk) pontos = 1000;                                   // igual
      else if(nd.startsWith(nk) || nk.startsWith(nd)) pontos = 500 + Math.min(nk.length,nd.length);
      else if(nd.includes(nk) || nk.includes(nd)) pontos = 200 + Math.min(nk.length,nd.length);
      else {
        // tolerante ao OCR: quantas letras seguidas em comum (prefixo do nome do exame)
        let c=0; const m=Math.min(nk.length,nd.length);
        while(c<m && nk[c]===nd[c]) c++;
        if(c>=5) pontos = c;                                       // pelo menos 5 letras iguais no começo
      }
      if(pontos>melhorPontos){ melhorPontos=pontos; melhor=p; }
    }
    return melhorPontos>0 ? melhor : null;
  };
  return busca('GEAP') || busca('CNEM');
}

    if(!nome){ erro.textContent='O nome é obrigatório.'; erro.classList.remove('hide'); return; }
    const file = o.querySelector('#g-arq').files[0] || null;
    if(file && file.size > 20*1024*1024){ erro.textContent='Arquivo maior que 20 MB.'; erro.classList.remove('hide'); return; }
    const b=o.querySelector('#g-salvar'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
    const seed = (Math.random()*1000000)|0;
    const total = examesSugeridos.reduce((s,x)=> s + (Number(x.valor)||0), 0);
    const { data:novo, error } = await sb.from('guias').insert({
      remessa_id: rem.id, nome,
      numero_guia: o.querySelector('#g-num').value.trim()||null,
      codigo_siass: o.querySelector('#g-cod').value.trim()||null,
      data_emissao: o.querySelector('#g-data').value||null,
      boneco_seed: seed,
      meta: { exames: examesSugeridos, total: total }
    }).select().single();
    if(error){ b.disabled=false; b.textContent='Guardar guia'; erro.textContent=error.message; erro.classList.remove('hide'); return; }
    if(file){
      const path = caminho(rem.id, novo.id, file.name);
      const up = await sb.storage.from(BUCKET).upload(path, file, { upsert:true, contentType:file.type||undefined });
      if(up.error){ b.disabled=false; b.textContent='Guardar guia'; erro.textContent='Guia criada, mas o arquivo falhou: '+up.error.message; erro.classList.remove('hide'); return; }
      await sb.from('guias').update({ arquivo_path: path }).eq('id', novo.id);
    }
    fecharModal(); toast('Guia guardada!','ok'); renderGuias(rem);
  };
}

function editarGuia(g){

    <h2>Editar guia</h2>
    <div class="campo"><label>Nome (do servidor / da guia)</label>
      <input id="e-nome" type="text" maxlength="160" value="${esc(g.nome)}"></div>
    <div class="campo"><label>Nº da guia</label>
      <input id="e-num" type="text" value="${esc(g.numero_guia)||''}"></div>
    <div class="campo"><label>Código SIASS</label>
      <input id="e-cod" type="text" value="${esc(g.codigo_siass)||''}"></div>
    <div class="campo"><label>Data de emissão</label>
      <input id="e-data" type="date" value="${g.data_emissao||''}"></div>
    <div id="e-erro" class="erro hide"></div>
    <div class="acoes">
      <button class="btn branco" id="e-volta">Voltar</button>
      <button class="btn azul" id="e-salvar">Salvar</button>
    </div>`);
  o.querySelector('#e-volta').onclick = ()=> abrirGuia(g);   // volta pra guia sem alterar
  o.querySelector('#e-nome').focus();
  o.querySelector('#e-salvar').onclick = async ()=>{
    const nome=o.querySelector('#e-nome').value.trim();
    const er=o.querySelector('#e-erro');
    if(!nome){ er.textContent='O nome é obrigatório.'; er.classList.remove('hide'); return; }
    const dados = {
      nome,
      numero_guia: o.querySelector('#e-num').value.trim()||null,
      codigo_siass: o.querySelector('#e-cod').value.trim()||null,
      data_emissao: o.querySelector('#e-data').value||null
    };
    const b=o.querySelector('#e-salvar'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
    const { error } = await sb.from('guias').update(dados).eq('id', g.id);
    if(error){ b.disabled=false; b.textContent='Salvar'; er.textContent=error.message; er.classList.remove('hide'); return; }
    Object.assign(g, dados);          // atualiza em memória
    toast('Guia atualizada!','ok');
    recarregar();                     // atualiza a lista atrás
    abrirGuia(g);                     // reabre a guia já com os dados novos
  };

function caminho(remId, guiaId, fileName){
  const limpo = (fileName||'arquivo').replace(/[^\w.\-]+/g,'_').slice(-80);
  return `${USER.id}/${remId}/${guiaId}/${Date.now()}_${limpo}`;
}

async function abrirGuia(g){

    <div class="ex-topo">Total da guia: <b id="g-total">R$ 0,00</b>

      <button class="btn branco" data-x style="flex:0 0 auto">Fechar</button>
    </div>
    <input id="g-troca-file" type="file" class="hide" accept="application/pdf,image/*,text/html,.pdf,.png,.jpg,.jpeg,.webp,.html">
    <div id="gd-erro" class="erro hide"></div>`);

  function fechar(){ fecharModal(); if(mudou) recarregar(); }
  o.querySelector('[data-x]').onclick = fechar;

  const paper = o.querySelector('#paper');
  function pintarPapel(){
    const seloNome = g.nome ? `<div class="selo-info" style="--ink:#1b3a6b"><b>NOME</b> <span class="lb2">${esc(g.nome)}</span></div>` : '';

  o.querySelector('#c-desfazer').onclick = async ()=>{

    pintarPapel();

    toast('Último carimbo removido.','ok');

  // ----- Exames e valor -----
  if(!Array.isArray(g.meta.exames)) g.meta.exames = [];
  async function salvarExames(){

  }
  async function renderExames(){
    await carregarPrecos();
    const cont = o.querySelector('#g-exames');

      cont.innerHTML = `<div class="ex-vazio">Nenhum exame. Toque em ＋ Exame para adicionar.</div>`;

      cont.innerHTML = g.meta.exames.map((x,idx)=>{
        const modo = x.modo || 'tabela';

        if(modo==='consulta'){

          selHtml = `<select class="ex-sel"><option value="">— a definir —</option>${opc}</select>`;
        } else {
          selHtml = `<select class="ex-sel">${optsTabela}</select>`;
        }
        const lido = ((x.codigo?x.codigo+' ':'')+(x.desc||'')).trim();
        return `<div class="ex-linha" data-i="${idx}">
          ${lido ? `<div class="ex-desc">lido: ${esc(lido)}</div>`:''}
          ${selHtml}
          <span class="ex-val">${fmtValor(x.valor)}</span>
          <button class="ex-modo" title="Alternar entre as 3 consultas e a tabela completa">${modo==='consulta'?'tabela':'3 consultas'}</button>
          <button class="ex-del" title="Remover">✕</button>
        </div>`;
      }).join('');
      cont.querySelectorAll('.ex-linha').forEach(l=>{
        const i=+l.dataset.i, x=g.meta.exames[i], sel=l.querySelector('.ex-sel');
        const modo = x.modo||'tabela';
        if(modo==='consulta'){
          const cc = CONSULTAS.find(c=>{ const p=precoPorChave(c.chave); return p && x.id===p.id; });
          if(cc) sel.value=cc.chave;
          sel.onchange = async ()=>{
            const c = CONSULTAS.find(cc=>cc.chave===sel.value);
            const p = c ? precoPorChave(c.chave) : null;
            if(p){ x.id=p.id; x.nome=p.nome; x.fonte=p.fonte; x.valor=Number(p.valor); }
            else { x.id=null; x.nome=''; x.fonte=''; x.valor=0; }
            await salvarExames(); renderExames();
          };
        } else {
          if(x.id) sel.value=x.id;
          sel.onchange = async ()=>{
            const p = PRECOS.find(pp=>pp.id===sel.value);
            if(p){ x.id=p.id; x.nome=p.nome; x.fonte=p.fonte; x.valor=Number(p.valor); }
            else { x.id=null; x.nome=''; x.fonte=''; x.valor=0; }
            await salvarExames(); renderExames();
          };

  o.querySelector('#g-add-ex').onclick = async ()=>{

  if(g.arquivo_path){

      const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(g.arquivo_path, 120);
      if(error){ toast('Não abriu: '+error.message,'bad'); return; }
      window.open(data.signedUrl, '_blank');
    };
  }

  o.querySelector('#g-troca').onclick = ()=> fileInput.click();
  fileInput.onchange = async ()=>{

    if(file.size > 20*1024*1024){ gde.textContent='Arquivo maior que 20 MB.'; gde.classList.remove('hide'); return; }
    const btn=o.querySelector('#g-troca'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';

    const up = await sb.storage.from(BUCKET).upload(path, file, { upsert:true, contentType:file.type||undefined });
    if(up.error){ btn.disabled=false; btn.textContent='Trocar arquivo'; gde.textContent=up.error.message; gde.classList.remove('hide'); return; }
    if(g.arquivo_path && g.arquivo_path!==path) await sb.storage.from(BUCKET).remove([g.arquivo_path]);
    await sb.from('guias').update({ arquivo_path: path }).eq('id', g.id);
    g.arquivo_path = path;
    fecharModal(); toast('Arquivo salvo!','ok'); recarregar();
  };
  o.querySelector('#g-del').onclick = async ()=>{
    const ok = await confirmar('Apagar guia?', `Isso apaga a guia "${g.nome}" e o arquivo dela. Não dá pra desfazer.`, 'Apagar');
    if(!ok) return;
    if(g.arquivo_path) await sb.storage.from(BUCKET).remove([g.arquivo_path]);
    const { error } = await sb.from('guias').delete().eq('id', g.id);
    if(error){ toast('Erro: '+error.message,'bad'); return; }
    fecharModal(); toast('Guia apagada.','ok'); recarregar();
  };
}

function recarregar(){
  if($('#busca').value.trim()) return onBusca();
  if(remessaAtual) renderGuias(remessaAtual);
  else if(armarioAtual) renderRemessas(armarioAtual);
  else renderArmarios();
}

/* ===================================================================
   BUSCA
   =================================================================== */
async function onBusca(){
  const q = $('#busca').value.trim();
  if(!q){ remessaAtual ? renderGuias(remessaAtual) : (armarioAtual ? renderRemessas(armarioAtual) : renderArmarios()); return; }
  let query = sb.from('guias').select('*, remessas(nome, armarios(nome))').eq('arquivada',false)
    .or(`nome.ilike.%${q}%,numero_guia.ilike.%${q}%,codigo_siass.ilike.%${q}%`)
    .order('criado_em',{ascending:false}).limit(60);
  if(remessaAtual){
    query = query.eq('remessa_id', remessaAtual.id);
  } else if(armarioAtual){
    const { data:rs } = await sb.from('remessas').select('id').eq('armario_id', armarioAtual.id);
    const ids = (rs||[]).map(r=>r.id);
    if(!ids.length){ pintarGuias([], { buscaVazia:true }); return; }
    query = query.in('remessa_id', ids);
  }
  const { data, error } = await query;
  if(error){ toast('Erro na busca: '+error.message,'bad'); return; }
  (data||[]).forEach(g=>{
    const rn = g.remessas?.nome, an = g.remessas?.armarios?.nome;
    g.__remnome = an ? `${an} › ${rn}` : rn;
  });
  pintarGuias(data||[], { buscaVazia:true });
}

/* ===================================================================
   VISUALIZADOR (SÓ LEITURA) — Sistema Dedica Saúde de Guias
   Puxa malas › pastas › guias do outro app (mesmo Supabase) e mostra
   como gaveta/boneco. Não grava, não edita, não apaga NADA.
   =================================================================== */
const BUCKET_MALAS = 'malas';
let _sgMala=null;
function _seedSG(str){ let h=0; str=String(str||''); for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; } return h||1; }
function sgFechar(){ const o=document.getElementById('sisguias'); if(o) o.remove(); }
function sgOverlay(inner){
  let o=document.getElementById('sisguias');
  if(!o){ o=document.createElement('div'); o.id='sisguias'; document.body.appendChild(o); }
  o.innerHTML = `<div class="sg-box">
    <div class="sg-top">
      <div class="sg-nav" id="sg-nav"></div>
      <button class="btn branco" onclick="sgFechar()">✕ Fechar</button>
    </div>
    <div class="sg-body" id="sg-body">${inner||''}</div>
  </div>`;
}
async function abrirSistemaGuias(){
  sgOverlay(`<div class="vazio"><span class="spin" style="border-color:var(--tinta);border-top-color:transparent"></span></div>`);
  document.getElementById('sg-nav').innerHTML = `<b class="banger" style="font-size:22px">📥 Sistema de Guias</b> <span class="sg-tagro">só leitura</span>`;
  const { data:malas, error } = await sb.from('malas').select('*').order('ordem',{ascending:true}).order('created_at',{ascending:true});
  const body=document.getElementById('sg-body');
  if(error){ body.innerHTML = `<div class="vazio"><div class="balao">Não consegui puxar: ${esc(error.message)}</div></div>`; return; }
  let cont={};
  const ids=(malas||[]).map(m=>m.id);
  if(ids.length){ const {data:gs}=await sb.from('mala_guias').select('mala_id').in('mala_id',ids); (gs||[]).forEach(g=>cont[g.mala_id]=(cont[g.mala_id]||0)+1); }
  let html='';
  if(!malas||!malas.length){ html=`<div class="vazio"><div class="balao">Nenhuma mala no sistema novo ainda.</div></div>`; }
  else{
    html+='<div class="grade-cab">';
    malas.forEach(m=>{
      const n=cont[m.id]||0;
      html+=`<div class="cab" data-mala="${esc(m.id)}" style="--tint:${esc(m.cor||'#4a90d9')}">
        <div class="plate">${esc(m.nome||'Mala')}</div>
        <div class="body"><div class="front"><div class="knob"></div></div><div class="front"><div class="knob"></div></div><div class="front"><div class="knob"></div></div></div>
        <div class="meta">${n} ${n===1?'guia':'guias'}</div>
      </div>`;
    });
    html+='</div>';
  }
  body.innerHTML=html;
  body.querySelectorAll('[data-mala]').forEach(c=> c.onclick=()=> sgAbrirMala((malas||[]).find(m=>m.id===c.dataset.mala)) );
}
async function sgAbrirMala(mala){
  if(!mala) return;
  _sgMala = mala;
  const body=document.getElementById('sg-body'); body.innerHTML=`<div class="vazio"><span class="spin" style="border-color:var(--tinta);border-top-color:transparent"></span></div>`;
  document.getElementById('sg-nav').innerHTML = `<button class="btn branco" onclick="abrirSistemaGuias()">← Malas</button> <b>${esc(mala.nome||'Mala')}</b> <button class="btn azul" onclick="sgImportarMala(_sgMala)">⬇️ Importar p/ o arquivo</button>`;
  const { data:pastas } = await sb.from('mala_pastas').select('id,nome').eq('mala_id',mala.id);
  const pnome={}; (pastas||[]).forEach(p=>pnome[p.id]=p.nome);
  const { data:guias, error } = await sb.from('mala_guias').select('*').eq('mala_id',mala.id).order('ordem',{ascending:true}).order('created_at',{ascending:true});
  if(error){ body.innerHTML=`<div class="vazio"><div class="balao">${esc(error.message)}</div></div>`; return; }
  let html='<div class="grade">';
  if(!guias||!guias.length){ html+=`<div class="vazio"><div class="balao">Sem guias nesta mala.</div></div>`; }
  (guias||[]).forEach(g=>{
    const cs=Array.isArray(g.carimbos)?g.carimbos:[];
    const ult=cs.slice(-2).map(c=>c&&c.t).filter(Boolean);
    html+=`<div class="pasta" data-guia="${esc(g.id)}">
      <div class="aba"></div>
      <div class="corpo">
        <div class="boneco">${boneco(_seedSG(g.id))}</div>
        <div class="nome">${esc(g.nome||'Guia')}</div>
        ${(g.pasta_id&&pnome[g.pasta_id])?`<div class="remlbl">📁 ${esc(pnome[g.pasta_id])}</div>`:''}
        <div class="tags">${g.arquivo_path?`<span class="tag clip">arquivo</span>`:`<span class="tag" style="background:#eee">sem arquivo</span>`}${(g.meta&&g.meta.exames)?`<span class="tag" style="background:#e7ddff">exames</span>`:''}</div>
        ${ult.length?`<div class="tags">${ult.map(t=>`<span class="selo-tag">${esc(String(t).toUpperCase())}</span>`).join('')}</div>`:''}
      </div>
    </div>`;
  });
  html+='</div>';
  body.innerHTML=html;
  body.querySelectorAll('[data-guia]').forEach(c=> c.onclick=()=> sgAbrirGuia((guias||[]).find(g=>g.id===c.dataset.guia)) );
}
function _examesDoTexto(txt){
  return String(txt||'').split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/(\d{8})\s*[-–]\s*(.+)$/);
    return m ? {codigo:m[1], desc:m[2].trim(), raw:l} : {codigo:'', desc:l, raw:l};
  }).filter(e=>e.desc);
}
function _mapExameImport(e){
  const consulta=/^10/.test(e.codigo||'');
  if(consulta){
    const low=(e.raw||e.desc||'').toLowerCase();
    const chave=/oftalmol|acuidade|visual/.test(low)?'OFTALMOLOG':/ginecol/.test(low)?'GINECOLOG':/cl[ií]nic/.test(low)?'CLINICO':'';
    const p=chave?precoPorChave(chave):null;
    return p?{desc:e.desc,codigo:e.codigo,modo:'consulta',id:p.id,nome:p.nome,fonte:p.fonte,valor:Number(p.valor)}
            :{desc:e.desc,codigo:e.codigo,modo:'consulta',id:null,nome:'',fonte:'',valor:0};
  }
  const p=precoPorCodigo(e.codigo)||valorDoExame(e.desc);
  return p?{desc:e.desc,codigo:e.codigo,modo:'tabela',id:p.id,nome:p.nome,fonte:p.fonte,valor:Number(p.valor)}
          :{desc:e.desc,codigo:e.codigo,modo:'tabela',id:null,nome:'',fonte:'',valor:0};
}
async function sgImportarMala(mala){
  if(!mala) return;
  if(!confirm(`Importar a mala "${mala.nome}" para o Arquivo de Guias?\n\nCria uma gaveta e as guias aqui (com PDF, OCR e soma). Não apaga nem altera nada do que já existe.`)) return;
  const body=document.getElementById('sg-body');
  const info = t => { if(body) body.innerHTML=`<div class="vazio"><div class="balao">${esc(t)}</div></div>`; };
  info('Preparando…');
  let arm;
  { const {data:arms}=await sb.from('armarios').select('*').eq('arquivada',false);
    arm=(arms||[]).find(a=>a.nome==='SISTEMA DE GUIAS');
    if(!arm){ const {data,error}=await sb.from('armarios').insert({nome:'SISTEMA DE GUIAS', cor:'#4a90d9'}).select().single(); if(error){toast('Erro: '+error.message,'bad');return;} arm=data; } }
  let rem;
  { const {data:rs}=await sb.from('remessas').select('*').eq('armario_id',arm.id).eq('arquivada',false);
    rem=(rs||[]).find(r=>r.nome===mala.nome);
    if(!rem){ const {data,error}=await sb.from('remessas').insert({nome:mala.nome, cor:mala.cor||'#4a90d9', armario_id:arm.id}).select().single(); if(error){toast('Erro: '+error.message,'bad');return;} rem=data; } }
  const {data:jaGuias}=await sb.from('guias').select('id,meta').eq('remessa_id',rem.id);
  const jaOrig=new Set(); (jaGuias||[]).forEach(x=>{ const o=x.meta&&x.meta.origem_guia_id; if(o) jaOrig.add(o); });
  const {data:novas}=await sb.from('mala_guias').select('*').eq('mala_id',mala.id).order('ordem',{ascending:true}).order('created_at',{ascending:true});
  const pend=(novas||[]).filter(g=>!jaOrig.has(g.id));
  if(!pend.length){ toast('Nada novo pra importar (já estava tudo lá).','ok'); armarioAtual=arm; sgFechar(); await abrirRemessa(rem); return; }
  await carregarPrecos();
  let ok=0, falhas=0;
  for(let i=0;i<pend.length;i++){
    const g=pend[i];
    info(`Importando ${i+1} de ${pend.length}… (lendo PDF)`);
    try{
      let nome=g.nome||'Guia', codigo=null, file=null;
      const examesSug=_examesDoTexto((g.meta&&g.meta.exames)||'').map(_mapExameImport);
      if(g.arquivo_path){
        const {data:blob}=await sb.storage.from('malas').download(g.arquivo_path);
        if(blob){
          const ext=(g.arquivo_path.split('.').pop()||'pdf');
          file=new File([blob], `${nome.replace(/[^\w.\-]+/g,'_')}.${ext}`, {type:blob.type||'application/pdf'});
        }
      }
      const total=examesSug.reduce((s,x)=>s+(Number(x.valor)||0),0);
      const seed=(Math.random()*1000000)|0;
      const {data:novo,error}=await sb.from('guias').insert({
        remessa_id:rem.id, nome, codigo_siass:codigo||null, boneco_seed:seed,
        meta:{ exames:examesSug, total, origem_mala_id:mala.id, origem_guia_id:g.id }
      }).select().single();
      if(error) throw error;
      if(file){
        const path=caminho(rem.id, novo.id, file.name);
        const up=await sb.storage.from(BUCKET).upload(path, file, {upsert:true, contentType:file.type||undefined});
        if(!up.error) await sb.from('guias').update({arquivo_path:path}).eq('id',novo.id);
      }
      ok++;
    }catch(err){ console.warn('import', err); falhas++; }
  }
  toast(`${ok} guia(s) importada(s)${falhas?` · ${falhas} com erro`:''}.`,'ok');
  armarioAtual=arm; sgFechar(); await abrirRemessa(rem);
}

function _libScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Falha ao carregar biblioteca'));document.head.appendChild(s);});}
let _libsPdf=false;
async function garantirPdf(){
  if(_libsPdf) return;
  await _libScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await _libScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  _libsPdf=true;
}
function correioCalendario(valor,titulo){
  const partes=/^(\d{4})-(\d{2})-(\d{2})$/.exec(valor||'');
  const vazio='<section class="cor-cal"><div class="cor-cal-topo"><div class="cor-cal-tipo">'+titulo+'</div></div><div class="cor-cal-vazio">Preencha a data acima para exibir o calendário.</div></section>';
  if(!partes) return vazio;
  const ano=Number(partes[1]),mes=Number(partes[2]),dia=Number(partes[3]);
  const data=new Date(0);data.setFullYear(ano,mes-1,dia);data.setHours(12,0,0,0);
  if(data.getFullYear()!==ano||data.getMonth()!==mes-1||data.getDate()!==dia) return vazio;
  const primeiro=new Date(data);primeiro.setDate(1);
  const ultimo=new Date(data);ultimo.setMonth(mes,0);
  const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let linhas='';
  const quantidade=Math.ceil((primeiro.getDay()+ultimo.getDate())/7)*7;
  for(let i=0;i<quantidade;i++){
    if(i%7===0) linhas+='<tr>';
    const n=i-primeiro.getDay()+1;
    linhas+=n<1||n>ultimo.getDate()?'<td></td>':'<td><span'+(n===dia?' class="cor-dia-marcado" aria-label="Data selecionada: '+n+'"':'')+'>'+n+'</span></td>';
    if(i%7===6) linhas+='</tr>';
  }
  return '<section class="cor-cal"><div class="cor-cal-topo"><div class="cor-cal-tipo">'+titulo+'</div><strong class="cor-cal-data">'+partes[3]+'/'+partes[2]+'/'+partes[1]+'</strong><div class="cor-cal-mes">'+nomes[mes-1]+' '+partes[1]+'</div></div><table aria-label="'+titulo+' — '+nomes[mes-1]+' '+ano+'"><thead><tr>'+['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(d=>'<th scope="col">'+d+'</th>').join('')+'</tr></thead><tbody>'+linhas+'</tbody></table></section>';
}
async function abrirCorreio(rem){
  if(!rem) return;
  const { data:guias } = await sb.from('guias').select('meta').eq('remessa_id',rem.id).eq('arquivada',false);
  const total=(guias||[]).reduce((s,g)=>s+((g.meta&&Number(g.meta.total))||0),0);
  abrirModal(`
    <h2 class="banger">Remessa para o correio</h2>
    <div class="cor-campos">
      <label>Data de emissão<input type="date" id="cor-data"></label>
      <label>Data máxima de faturamento<input type="date" id="cor-faturamento"></label>
      <label>Observação (opcional)<textarea id="cor-obs" rows="2" placeholder="o que você achar necessário…"></textarea></label>
    </div>
    <div id="correio-cover" class="cor-cover">
      <div class="cor-desenho">
        <img src="${IMG_CORREIO}" alt="Dedica Saúde">
        <div class="cor-carta-dados"><span>REMESSA Nº ${esc(rem.nome||'')}</span><strong>${fmtValor(total)}</strong></div>
      </div>
      <div class="cor-agenda">
        <h3>Calendário de emissão e faturamento</h3>
        <div class="cor-calendarios" id="cor-calendarios"></div>
        <div class="cor-obs-l" id="cor-obs-l">Comprovante de Remessa · Dedica Saúde</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
      <button class="btn" id="cor-pdf">⬇️ Baixar PDF</button>
      <button class="btn branco" onclick="fecharModal()">Fechar</button>
    </div>`);
  const upd=()=>{
    const emissao=document.getElementById('cor-data').value;
    const faturamento=document.getElementById('cor-faturamento').value;
    document.getElementById('cor-calendarios').innerHTML=correioCalendario(emissao,'Emissão')+correioCalendario(faturamento,'Faturamento máximo');
    const obs=document.getElementById('cor-obs').value;
    document.getElementById('cor-obs-l').textContent='Comprovante de Remessa · Dedica Saúde'+(obs?' · Obs: '+obs:'');
  };
  ['cor-data','cor-faturamento','cor-obs'].forEach(id=>{document.getElementById(id).oninput=upd;});
  upd();
  document.getElementById('cor-pdf').onclick=()=>baixarCorreioPdf(rem);
}
async function baixarCorreioPdf(rem){
  const el=document.getElementById('correio-cover'); if(!el) return;
  try{
    toast('Gerando PDF…');
    await garantirPdf();
    const canvas=await html2canvas(el, {scale:2, useCORS:true, backgroundColor:'#ffffff'});
    const img=canvas.toDataURL('image/jpeg',0.92);
    const { jsPDF }=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const r=Math.min(pw/canvas.width, ph/canvas.height); const w=canvas.width*r, h=canvas.height*r;
    pdf.addImage(img,'JPEG',(pw-w)/2,(ph-h)/2,w,h);
    pdf.save(`Remessa ${(rem.nome||'').replace(/[^\w.\-]+/g,'_')}.pdf`);
  }catch(e){ console.warn(e); toast('Não consegui gerar o PDF: '+(e.message||''),'bad'); }
}
let _semExMap={};
async function verificarSemExames(rem){
  if(!rem) return;
  const { data:guias, error } = await sb.from('guias').select('*').eq('remessa_id',rem.id).eq('arquivada',false);
  if(error){ toast('Erro: '+error.message,'bad'); return; }
  const ordenadas=(guias||[]);
  const semex=ordenadas.filter(g=> !(g.meta && Number(g.meta.total)>0));
  _semExMap={}; semex.forEach(g=>_semExMap[g.id]=g);
  let html=`<h2 class="banger">Guias sem valor (${semex.length})</h2>`;
  if(!semex.length){ html+=`<p style="font-weight:700">Todas as guias já têm valor. 🎉</p>`; }
  else{
    html+=`<p style="margin:2px 0 10px">Guias que vieram <b>sem valor</b> (o OCR não leu, ou sem preço). Clique em <b>PDF</b> pra ver, digite os exames (um por linha) e salve. Ex.: <b>40301605 - Colesterol total</b></p>`;
    html+=`<div class="vex-lista">`;
    semex.forEach(g=>{
      const flag = (g.meta&&g.meta.ocr_falhou) ? `<span class="tag" style="background:#f3b0b0">OCR não leu</span>` : `<span class="tag" style="background:#ffe0a3">sem valor</span>`;
      html+=`<div class="vex-card mini" id="vex-${g.id}">
        <div class="vex-top"><b>${esc(g.nome||'Guia')}</b> ${flag}
          ${g.arquivo_path?`<button class="btn azul" onclick="vexPdf('${g.id}')">📄 PDF</button>`:`<span class="tag" style="background:#eee">sem arquivo</span>`}
        </div>
        <textarea class="vex-txt" id="vext-${g.id}" placeholder="Um exame por linha:\n40301605 - Colesterol total\n40302547 - Triglicerídeos"></textarea>
        <div class="vex-bot"><span class="vex-tot" id="vexs-${g.id}"></span>
          <button class="btn" onclick="vexSalvar('${g.id}')">Salvar exames</button></div>
      </div>`;
    });
    html+=`</div>`;
  }
  html+=`<div style="text-align:right;margin-top:12px"><button class="btn branco" onclick="fecharModal()">Fechar</button></div>`;
  abrirModal(html);
}
async function vexPdf(id){
  const g=_semExMap[id]; if(!g||!g.arquivo_path) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(g.arquivo_path, 180);
  if(error){ toast('Erro ao abrir: '+error.message,'bad'); return; }
  window.open(data.signedUrl,'_blank');
}
async function vexSalvar(id){
  const g=_semExMap[id]; if(!g) return;
  const el=document.getElementById('vext-'+id); const txt=el?el.value:'';
  const brutos=_examesDoTexto(txt);
  if(!brutos.length){ toast('Digite pelo menos um exame.','bad'); return; }
  await carregarPrecos();
  const exames=brutos.map(_mapExameImport);
  const total=exames.reduce((s,x)=> s + (Number(x.valor)||0), 0);
  const meta=Object.assign({}, g.meta||{}, { exames, total, ocr_falhou:false });
  const { error } = await sb.from('guias').update({meta}).eq('id',id);
  if(error){ toast('Erro: '+error.message,'bad'); return; }
  g.meta=meta;
  const s=document.getElementById('vexs-'+id); if(s) s.textContent='✔ salvo · R$ '+total.toFixed(2).replace('.',',');
  const card=document.getElementById('vex-'+id); if(card) card.classList.add('vex-ok');
  toast('Exames salvos.','ok');
}
async function calcularGaveta(rem){
  if(!rem) return;
  if(!confirm('Calcular as guias desta gaveta?\n\nLê o PDF anexado de cada guia (OCR), casa os exames com a tabela de preços e soma. Não apaga nada — o que não der pra ler fica como está.')) return;
  const { data:guias, error } = await sb.from('guias').select('*').eq('remessa_id',rem.id).eq('arquivada',false);
  if(error){ toast('Erro: '+error.message,'bad'); return; }
  await carregarPrecos();
  // reforço: exames já lidos no sistema novo (usados só se o OCR falhar)
  const origIds=(guias||[]).map(g=>g.meta&&g.meta.origem_guia_id).filter(Boolean);
  const mapNovo={};
  if(origIds.length){
    const {data:mg}=await sb.from('mala_guias').select('id,meta').in('id', origIds);
    (mg||[]).forEach(x=> mapNovo[x.id]=(x.meta&&x.meta.exames)||'');
  }
  const o=abrirModal(`<h2>Calculando…</h2><p id="calc-status" style="font-weight:700">Preparando…</p>`);
  const status=t=>{const s=o.querySelector('#calc-status'); if(s) s.textContent=t;};
  let feitas=0, semExame=0;
  for(let i=0;i<(guias||[]).length;i++){
    const g=guias[i]; status(`Lendo ${i+1} de ${guias.length}…  (${g.nome||'guia'})`);
    let brutos=[], nomeOCR='', codOCR='', ocrOk=false;
    // 1) OCR do PDF anexado (do jeito do antigo)
    if(g.arquivo_path){
      try{
        const { data:blob } = await sb.storage.from(BUCKET).download(g.arquivo_path);
        if(blob){
          const ext=(g.arquivo_path.split('.').pop()||'pdf');
          const file=new File([blob], `g.${ext}`, {type:blob.type||'application/pdf'});
          const r=await lerGuiaOCR(file);
          nomeOCR=r.nome||''; codOCR=r.codigo||'';
          brutos=(r.exames||[]).map(e=>({codigo:e.codigo,desc:e.desc,raw:e.raw}));
          if(brutos.length) ocrOk=true;
        }
      }catch(err){ console.warn('ocr', err); }
    }
    // 2) se o OCR não achou, usa os exames que o novo já leu
    let usouReserva=false;
    if(!brutos.length){
      const oid=g.meta&&g.meta.origem_guia_id;
      if(oid && mapNovo[oid]){ brutos=_examesDoTexto(mapNovo[oid]); if(brutos.length) usouReserva=true; }
    }
    if(!brutos.length){
      // marca que o OCR falhou (pra listar depois) — NÃO zera nada
      const meta=Object.assign({}, g.meta||{}, { ocr_falhou:true });
      await sb.from('guias').update({meta}).eq('id',g.id);
      g.meta=meta; semExame++; continue;
    }
    const exames=brutos.map(_mapExameImport);
    const total=exames.reduce((s,x)=> s + (Number(x.valor)||0), 0);
    const meta=Object.assign({}, g.meta||{}, { exames, total, ocr_falhou:false, ocr_reserva:usouReserva });
    const upd={ meta };
    if(nomeOCR && !g.nome) upd.nome=nomeOCR;
    if(codOCR && !g.codigo_siass) upd.codigo_siass=codOCR;
    await sb.from('guias').update(upd).eq('id',g.id);
    feitas++;
  }
  fecharModal();
  toast(`${feitas} calculada(s)${semExame?` · ${semExame} o OCR não leu (veja em “Verificar problemas”)`:''}.`,'ok');
  await renderGuias(rem);
}
async function sgAbrirGuia(g){
  if(!g) return;
  const body=document.getElementById('sg-body'); if(!body) return;
  document.getElementById('sg-nav').innerHTML = `<button class="btn branco" onclick="sgAbrirMala(_sgMala)">← ${esc((_sgMala&&_sgMala.nome)||'Mala')}</button> <b>${esc(g.nome||'Guia')}</b> <span class="sg-tagro">só leitura</span>`;
  const cs=Array.isArray(g.carimbos)?g.carimbos:[];
  const exames=(g.meta && g.meta.exames) || '';
  body.innerHTML = `<div class="sg-detalhe">
    <div class="sg-cabg"><div class="boneco" style="width:90px">${boneco(_seedSG(g.id))}</div>
      <div><h2 class="banger" style="font-size:26px">${esc(g.nome||'Guia')}</h2>
      ${cs.length?`<div class="tags">${cs.map(c=>`<span class="selo-tag">${esc(String(c&&c.t||'').toUpperCase())}${c&&c.n?(' '+esc(c.n)):''}</span>`).join('')}</div>`:''}</div>
    </div>
    <h3 style="margin:14px 0 6px" class="banger">Exames</h3>
    <div class="sg-exames">${exames? esc(exames).replace(/\n/g,'<br>') : 'Sem exames lançados nesta guia ainda.'}</div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      ${g.arquivo_path?`<button class="btn azul" id="sg-pdf">📄 Abrir PDF</button>`:`<span class="tag" style="background:#eee">sem arquivo</span>`}
      <button class="btn branco" onclick="sgAbrirMala(_sgMala)">Voltar</button>
    </div>
  </div>`;
  const b=document.getElementById('sg-pdf');
  if(b) b.onclick = async ()=>{
    const { data, error } = await sb.storage.from(BUCKET_MALAS).createSignedUrl(g.arquivo_path, 180);
    if(error){ toast('Erro ao abrir: '+error.message,'bad'); return; }
    window.open(data.signedUrl, '_blank');
  };
}
